<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal | Home</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="theme.js"></script>
</head>

<body>

    <!-- 🔀 Theme Toggle Button -->
    <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

    <!-- 📌 Navigation -->
    <nav class="navbar">
        <div class="logo">🎓 Student Portal</div>
        <ul class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="profile.html">Profile</a>
            <a href="courses.html">Courses</a>
            <a href="assignments.html">Assignments</a>
            <a href="grades.html">Grades</a>
            <a href="event.html">Events</a>
            <a href="feedback.html">Feedback</a>
            <a href="contact.html">Contact</a>
            <a href="faqs.html">FAQs</a>
            <a href="login.html" class="login-btn">Login</a>
        </ul>
    </nav>
    <script>
        const id = localStorage.getItem("studentID");
        const shouldWelcome = localStorage.getItem("showWelcome");

        if (id && shouldWelcome === "true") {
            alert(`🎉 Welcome, ${id}!`);
            localStorage.removeItem("showWelcome"); // So it doesn’t show again
        }
    </script>


    <!-- 🎯 Hero Section -->
    <header class="hero">
        <div class="hero-text">
            <h1>Welcome to the Student Portal</h1>
            <p>Access your academic records, assignments, events, and more — all in one place.</p>
            <a href="login.html" class="btn">Login Now</a>
        </div>
    </header>

</body>

</html>
