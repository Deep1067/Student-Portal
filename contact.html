<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact | Student Portal</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="theme.js"></script>
</head>
<body>

  <!-- 🌗 Theme Toggle -->
  <button class="theme-toggle" onclick="toggleTheme()">🌙</button>

  <!-- 🔝 Navbar -->
  <nav class="navbar">
    <div class="logo">Student Portal</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="courses.html">Courses</a>
      <a href="assignments.html">Assignments</a>
      <a href="grades.html">Grades</a>
      <a href="attendance.html">Attendance</a>
      <a href="event.html">Events</a>
      <a href="feedback.html">Feedback</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="faqs.html">FAQs</a>
    </div>
  </nav>

  <!-- 📞 Contact Section -->
  <section class="contact-section">
    <div class="contact-container">
      <h1>Contact Us</h1>
      <p class="contact-subtext">Need help? Reach out to our support team or submit a query.</p>

      <div class="contact-grid">
        <!-- Contact Form -->
        <form class="contact-form">
          <label for="name">Your Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>

          <label for="email">Your Email</label>
          <input type="email" id="email" placeholder="Enter your email" required>

          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your query here..." required></textarea>

          <button type="submit">Send Message</button>
        </form>

        <!-- Contact Info -->
        <div class="contact-info">
          <h2>Support Information</h2>
          <p><strong>Email:</strong> support@studentportal.edu</p>
          <p><strong>Phone:</strong> +91 98765 43210</p>
          <p><strong>Office Hours:</strong> Mon – Fri, 9 AM – 4 PM</p>

          <div class="contact-icons">
            <a href="#"><i>🌐</i></a>
            <a href="#"><i>📘</i></a>
            <a href="#"><i>🐦</i></a>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
